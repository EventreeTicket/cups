<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFID hardcups testen</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #101719; color: #edf4ed; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, #284b3c, transparent 35rem), #101719; }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.5rem); letter-spacing: -.05em; }
    .intro { color: #b9c9bd; margin: 12px 0 32px; font-size: 1.05rem; }
    section { background: #172220; border: 1px solid #31443c; border-radius: 18px; padding: 24px; margin-top: 18px; box-shadow: 0 20px 70px #0004; }
    label { display: block; margin: 0 0 8px; font-weight: 650; }
    input, textarea { width: 100%; border: 1px solid #486254; border-radius: 10px; background: #0e1513; color: inherit; padding: 12px; font: inherit; }
    textarea { min-height: 128px; resize: vertical; }
    .hint { margin: 7px 0 20px; color: #9caf9f; font-size: .9rem; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    button { appearance: none; border: 0; border-radius: 10px; padding: 13px 18px; color: #09120d; font: 700 1rem inherit; cursor: pointer; }
    #in { background: #a7f3bf; } #out { background: #f6c98c; } #refresh { background: #b7d6f8; }
    #clear { background: #ef9a91; }
    button:disabled { opacity: .55; cursor: wait; }
    #message { min-height: 24px; margin: 16px 0 0; color: #b9c9bd; }
    #message.error { color: #ffaea4; } #message.ok { color: #a7f3bf; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .live { color:#a7f3bf; font-size:.82rem; white-space:nowrap; }
    h2 { margin: 0; font-size: 1.2rem; }
    #cups { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 8px; }
    #cups li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px; border-radius: 9px; background: #0e1513; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .state { border-radius: 99px; padding: 4px 9px; font-size: .76rem; font-weight: 800; letter-spacing: .06em; }
    .IN { background: #1f6c43; color: #d9ffe6; } .OUT { background: #805425; color: #fff0d4; }
    .empty { color: #9caf9f; padding: 8px 0; }
  </style>
</head>
<body>
  <main>
    <h1>RFID hardcups</h1>
    <p class="intro">Live-overzicht van de RFID-scans. <a href="/api.html">Bekijk API-specificatie</a>.</p>

    <section>
      <div class="heading">
        <h2>Actuele bekerstatus</h2>
        <div><span id="live-status" class="live">● Live</span> <button id="refresh" type="button">Ververs</button> <button id="clear" type="button">Wis demo-data</button></div>
      </div>
      <p id="message" role="status"></p>
      <ul id="cups"><li class="empty">Status wordt geladen…</li></ul>
    </section>
  </main>

  <script>
    const message = document.querySelector('#message');
    const cups = document.querySelector('#cups');
    const liveStatus = document.querySelector('#live-status');

    function showMessage(text, type = '') {
      message.textContent = text;
      message.className = type;
    }

    async function loadCups() {
      try {
        const response = await fetch('/api/cups');
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Status kon niet worden geladen');
        cups.replaceChildren();
        if (!result.cups.length) {
          cups.innerHTML = '<li class="empty">Nog geen bekers gescand.</li>';
          return;
        }
        for (const cup of result.cups) {
          const item = document.createElement('li');
          const tag = document.createElement('span');
          tag.className = 'tag'; tag.textContent = cup.tag;
          const state = document.createElement('span');
          state.className = `state ${cup.status}`; state.textContent = cup.status === 'IN' ? 'INGESCHREVEN' : 'UITGESCHREVEN';
          item.append(tag, state); cups.append(item);
        }
        liveStatus.textContent = `● Live · ${new Date().toLocaleTimeString('nl-NL')}`;
      } catch (error) {
        cups.innerHTML = `<li class="empty">${error.message}</li>`;
        liveStatus.textContent = '● Verbinding mislukt';
      }
    }

    async function clearDemoData() {
      if (!confirm('Weet je zeker dat je alle gescande bekers en scan-historie wilt wissen?')) return;
      document.querySelector('#clear').disabled = true;
      showMessage('Demo-data wordt gewist…');
      try {
        const response = await fetch('/api/demo/reset', { method: 'POST' });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Wissen mislukt');
        showMessage('Demo-data is gewist.', 'ok');
        await loadCups();
      } catch (error) {
        showMessage(`Niet gewist: ${error.message}`, 'error');
      } finally {
        document.querySelector('#clear').disabled = false;
      }
    }

    document.querySelector('#clear').addEventListener('click', clearDemoData);
    document.querySelector('#refresh').addEventListener('click', loadCups);
    loadCups();
    setInterval(() => {
      if (!document.hidden) loadCups();
    }, 2000);
  </script>
</body>
</html>
